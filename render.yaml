services:
  # Backend API Service
  - type: web
    name: college-publications-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: >-
      cd backend &&
      npm install --include=dev &&
      export $(grep -v '^#' .env.production | xargs) &&
      npx prisma generate &&
      npx prisma db push --accept-data-loss &&
      npx prisma db seed &&
      npm run build
    startCommand: cd backend && export $(grep -v '^#' .env.production | xargs) && node dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/departments
