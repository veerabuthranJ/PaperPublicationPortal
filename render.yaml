services:
  # Backend API Service
  - type: web
    name: college-publications-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install --include=dev && cd backend && npx prisma generate && npm run build
    startCommand: cd backend && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false  # Set this in Render dashboard
      - key: REDIS_HOST
        sync: false  # Set this in Render dashboard
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false  # Set this in Render dashboard
      - key: FRONTEND_URL
        sync: false  # Set this in Render dashboard after deploying frontend
    healthCheckPath: /api/departments
