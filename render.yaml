services:
  # Backend API Service
  - type: web
    name: college-publications-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed && npm run build
    startCommand: cd backend && node dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
    healthCheckPath: /api/departments
